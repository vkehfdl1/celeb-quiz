<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>celeb-quiz — JS unit tests</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 1rem; background: #0a0a0a; color: #f5f5f5; }
    h1 { font-size: 1.4rem; }
    .test { padding: .25rem .5rem; margin: .15rem 0; border-radius: 4px; font-family: ui-monospace, monospace; font-size: .9rem; }
    .pass { background: #0f3a1a; color: #6fdb8c; }
    .fail { background: #3a0f0f; color: #ff8c8c; white-space: pre-wrap; }
    .skip { background: #2a2a2a; color: #aaa; }
    #summary { margin-top: 1rem; padding: .5rem; border-radius: 4px; font-weight: bold; }
    #summary.all-green { background: #0f3a1a; color: #6fdb8c; }
    #summary.has-fail { background: #3a0f0f; color: #ff8c8c; }
  </style>
</head>
<body>
  <h1>celeb-quiz JS unit tests</h1>
  <div id="results"></div>
  <div id="summary"></div>
  <script type="module">
    import { runAll } from './harness.js';
    import './test-shuffle.js';
    import './test-quiz-loader.js';
    import './test-sync.js';
    runAll();
  </script>
</body>
</html>
