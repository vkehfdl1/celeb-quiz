<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>celeb-quiz · player</title>
  <link rel="stylesheet" href="/web/css/styles.css">
</head>
<body>
  <div class="player" id="player">
    <div class="fs-hint" id="fs-hint">F11 = 전체화면</div>

    <div class="waiting" id="waiting">
      <div>퀴즈를 시작해 주세요</div>
      <div class="hint">Host 창에서 Start 버튼을 눌러주세요</div>
    </div>

    <div class="top-bar">
      <div class="countdown" id="countdown" hidden>--</div>
      <div class="dang" id="dang" hidden>땡!</div>
    </div>

    <div class="stage" id="stage" hidden>
      <img id="photo" alt="" referrerpolicy="no-referrer">
    </div>

    <div class="bottom-bar">
      <div class="reveal" id="reveal">
        <div id="reveal-name"></div>
        <span class="category" id="reveal-category"></span>
      </div>
      <div class="attribution" id="attribution" hidden></div>
    </div>
  </div>

  <script type="module" src="/web/js/player.js"></script>
</body>
</html>
