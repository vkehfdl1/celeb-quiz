<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>celeb-quiz · host</title>
  <link rel="stylesheet" href="/web/css/styles.css">
</head>
<body>
  <div class="disconnect-notice" id="disconnect-notice">
    Player 창이 끊겼습니다 — Reopen Player 버튼을 눌러주세요.
  </div>

  <div class="host">
    <header>
      <div class="title">
        <span id="quiz-title" class="muted">불러오는 중…</span>
        <span class="status-pill" id="status-pill">대기</span>
      </div>
      <div class="countdown" id="countdown" aria-live="off">--</div>
    </header>

    <main>
      <div class="photo-wrap">
        <img id="photo" alt="" referrerpolicy="no-referrer">
      </div>
      <aside class="info">
        <div class="progress" id="progress">--/--</div>
        <div class="name" id="name" hidden></div>
        <div class="category" id="category"></div>
        <div class="attribution" id="attribution"></div>
      </aside>
    </main>

    <footer>
      <button id="next-btn" class="btn btn-primary">Next <kbd class="kbd">Space</kbd></button>
      <button id="reveal-btn" class="btn">Reveal <kbd class="kbd">R</kbd></button>
      <button id="restart-btn" class="btn btn-danger">Restart <kbd class="kbd">Esc</kbd></button>
      <button id="reopen-btn" class="btn">Reopen Player ↗</button>
      <span style="flex:1"></span>
      <span class="muted" id="hint">Space=다음 · R=정답 · Esc=재시작</span>
    </footer>
  </div>

  <script type="module" src="/web/js/host.js"></script>
</body>
</html>
