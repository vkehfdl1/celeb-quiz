<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>celeb-quiz · admin</title>
  <link rel="stylesheet" href="/web/css/styles.css">
  <link rel="stylesheet" href="/web/css/admin.css">
</head>
<body class="admin">
  <header class="admin-header">
    <h1><span class="accent">celeb-quiz</span> · admin</h1>
    <select id="quiz-select" aria-label="퀴즈 선택">
      <option value="">퀴즈 불러오는 중…</option>
    </select>
    <span class="fill"></span>
    <a href="/web/" class="muted" style="font-size: 0.85rem;">← 게임 화면</a>
  </header>

  <main class="container">
    <section class="admin-stats" id="stats" aria-live="polite">
      <span class="stat-pill">총 <strong id="stat-total">0</strong></span>
      <span class="stat-pill ok">사진 OK <strong id="stat-ok">0</strong></span>
      <span class="stat-pill danger">실패 <strong id="stat-failed">0</strong></span>
    </section>

    <details class="admin-add-form" open>
      <summary>+ 인물 추가</summary>
      <form id="add-form">
        <div class="field">
          <label for="add-name">이름</label>
          <input type="text" id="add-name" name="name" required autocomplete="off">
        </div>
        <div class="field">
          <label for="add-id">ID (자동 추출, 수정 가능)</label>
          <input type="text" id="add-id" name="id" autocomplete="off" placeholder="lee-jung-hoo">
        </div>
        <div class="field">
          <label for="add-category">카테고리</label>
          <input type="text" id="add-category" name="category" required list="category-list" autocomplete="off">
          <datalist id="category-list"></datalist>
        </div>
        <div class="field">
          <label for="add-disambig">설명 (옵션)</label>
          <input type="text" id="add-disambig" name="disambiguation" autocomplete="off">
        </div>
        <div class="field-checkbox">
          <input type="checkbox" id="add-autofetch" name="auto_fetch" checked>
          <label for="add-autofetch">자동으로 사진 가져오기 (auto-fetch)</label>
        </div>
        <div class="submit-row">
          <button type="reset" class="btn">취소</button>
          <button type="submit" class="btn btn-primary">추가</button>
        </div>
      </form>
    </details>

    <section class="admin-filters">
      <div class="field" style="flex: 2 1 280px;">
        <label for="filter-search">검색</label>
        <input type="search" id="filter-search" placeholder="이름으로 검색…" autocomplete="off">
      </div>
      <div class="field">
        <label for="filter-category">카테고리</label>
        <select id="filter-category">
          <option value="">전체</option>
        </select>
      </div>
      <div class="field">
        <label for="filter-status">상태</label>
        <select id="filter-status">
          <option value="all">전체</option>
          <option value="ok">사진 OK</option>
          <option value="failed">사진 실패</option>
        </select>
      </div>
      <div class="muted" id="filter-result-count" style="font-size: 0.85rem; padding-bottom: 0.5rem;"></div>
    </section>

    <section class="admin-grid" id="grid" aria-live="polite">
      <div class="empty-state">
        <p>퀴즈를 선택해 주세요.</p>
      </div>
    </section>
  </main>

  <textarea class="paste-target" id="paste-target" aria-hidden="true" tabindex="-1"></textarea>
  <div class="toast-stack" id="toasts" aria-live="polite"></div>
  <input type="file" id="file-picker" accept="image/*" hidden>

  <template id="entry-card-tmpl">
    <article class="entry-card" tabindex="0">
      <div class="entry-thumb">
        <img alt="" loading="lazy" referrerpolicy="no-referrer">
        <span class="placeholder" hidden>📷</span>
        <div class="spinner-overlay" hidden><span class="spinner lg"></span></div>
      </div>
      <div class="entry-meta">
        <span class="entry-status-pill"></span>
        <span class="entry-name"></span>
        <span class="entry-category muted"></span>
      </div>
      <div class="entry-actions">
        <button type="button" class="btn" data-action="paste" title="이 카드를 선택한 뒤 Cmd+V (붙여넣기)">📋 붙여넣기</button>
        <button type="button" class="btn" data-action="upload" title="파일 업로드">📁 파일</button>
        <button type="button" class="btn" data-action="url" title="URL 입력">🌐 URL</button>
        <button type="button" class="btn" data-action="refetch" title="다시 검색">🔄 재검색</button>
        <button type="button" class="btn btn-danger" data-action="delete" title="삭제">🗑</button>
      </div>
    </article>
  </template>

  <script type="module" src="/web/js/admin.js"></script>
</body>
</html>
